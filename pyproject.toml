[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai04"
version = "0.1.0"
description = "GEOAI 04: local bi-temporal satellite change detection (Phase 1 prototype)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
